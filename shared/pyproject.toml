[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dss-common"
version = "0.1.0"
description = "Small shared utilities for DSS Research & Analytics projects"
requires-python = ">=3.11"
dependencies = ["numpy", "pyyaml"]

[tool.setuptools.packages.find]
include = ["dss_common*"]
